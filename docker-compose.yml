services:
  backend:
    build: ./backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend/app:/app/app
      - ./backend/db:/app/db
      - ./backend/data:/app/data
    environment:
      LOG_STORAGE_DIR: /app/data/logs
      CSV_STORAGE_DIR: /app/data/csv
      REPORT_OUTPUT_DIR: /app/data/csv_reports_final
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_PROXY: http://backend:8000
    command: npm run dev -- --host 0.0.0.0
